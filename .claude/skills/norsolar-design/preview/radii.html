<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Norsolar · Radii</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 32px; background: #fff; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px; align-items: end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 96px; height: 96px; background: var(--ns-navy); }
  .name { font-family: var(--font-display); font-weight: 600; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ns-navy); }
  .px { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ns-text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">SM</div><div class="px">6 px</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">MD</div><div class="px">10 px</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">LG</div><div class="px">16 px</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="name">XL</div><div class="px">24 px</div></div>
    <div class="item"><div class="box" style="border-radius:999px; height:48px; width:140px; background:var(--ns-orange);"></div><div class="name">Pill</div><div class="px">999 px</div></div>
  </div>
</body>
</html>
