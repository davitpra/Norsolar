<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Norsolar · Colores Primarios</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); height: 200px; }
  .swatch {
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px;
    color: #fff;
    font-family: var(--font-body);
  }
  .name {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0.85;
  }
  .hex { font-size: 13px; opacity: 0.8; font-family: ui-monospace, monospace; }
  .role { font-size: 11px; opacity: 0.7; margin-top: 4px; }
  .dark { color: #1B2A4A; }
</style>
</head>
<body>
  <div class="grid">
    <div class="swatch" style="background:#F28C28">
      <div class="name">Naranja Solar</div>
      <div class="hex">#F28C28</div>
      <div class="role">Primario · CTAs · Acentos</div>
    </div>
    <div class="swatch" style="background:#1B2A4A">
      <div class="name">Azul Marino</div>
      <div class="hex">#1B2A4A</div>
      <div class="role">Header · Footer · Texto</div>
    </div>
    <div class="swatch" style="background:#0F1A2E">
      <div class="name">Navy Profundo</div>
      <div class="hex">#0F1A2E</div>
      <div class="role">Hero · CTA · Formulario</div>
    </div>
    <div class="swatch" style="background:#22C55E">
      <div class="name">Verde Éxito</div>
      <div class="hex">#22C55E</div>
      <div class="role">Ahorro · Métricas +</div>
    </div>
  </div>
</body>
</html>
