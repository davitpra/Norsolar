<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Norsolar · Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 24px 32px; background: #fff; font-family: var(--font-body); }
  .row {
    display: grid;
    grid-template-columns: 70px 1fr 60px;
    align-items: center;
    gap: 14px;
    padding: 7px 0;
  }
  .name { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ns-navy); }
  .bar { background: var(--ns-orange); height: 12px; border-radius: 4px; }
  .px { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ns-text-muted); text-align: right; }
</style>
</head>
<body>
  <div class="row"><div class="name">space-1</div><div class="bar" style="width:4px"></div><div class="px">4 px</div></div>
  <div class="row"><div class="name">space-2</div><div class="bar" style="width:8px"></div><div class="px">8 px</div></div>
  <div class="row"><div class="name">space-3</div><div class="bar" style="width:12px"></div><div class="px">12 px</div></div>
  <div class="row"><div class="name">space-4</div><div class="bar" style="width:16px"></div><div class="px">16 px</div></div>
  <div class="row"><div class="name">space-5</div><div class="bar" style="width:24px"></div><div class="px">24 px</div></div>
  <div class="row"><div class="name">space-6</div><div class="bar" style="width:32px"></div><div class="px">32 px</div></div>
  <div class="row"><div class="name">space-7</div><div class="bar" style="width:48px"></div><div class="px">48 px</div></div>
  <div class="row"><div class="name">space-8</div><div class="bar" style="width:64px"></div><div class="px">64 px</div></div>
  <div class="row"><div class="name">space-9</div><div class="bar" style="width:80px"></div><div class="px">80 px</div></div>
  <div class="row"><div class="name">space-10</div><div class="bar" style="width:100px"></div><div class="px">100 px</div></div>
</body>
</html>
