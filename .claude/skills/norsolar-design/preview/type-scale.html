<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Norsolar · Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 24px 32px; background: #fff; font-family: var(--font-body); }
  .row {
    display: grid;
    grid-template-columns: 90px 1fr;
    align-items: baseline;
    padding: 10px 0;
    border-bottom: 1px solid #F0F1F4;
  }
  .row:last-child { border: 0; }
  .tag {
    font-family: ui-monospace, monospace;
    font-size: 11px;
    color: var(--ns-text-muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .h1 { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.05; letter-spacing: -0.01em; color: var(--ns-navy); }
  .h2 { font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; color: var(--ns-navy); }
  .h3 { font-family: var(--font-display); font-weight: 600; font-size: 20px; color: var(--ns-navy); }
  .body { font-family: var(--font-body); font-size: 16px; line-height: 1.6; color: var(--ns-navy); }
  .small { font-family: var(--font-body); font-size: 13px; color: var(--ns-text-muted); }
</style>
</head>
<body>
  <div class="row"><span class="tag">H1 · 40</span><span class="h1">Energía solar para Ecuador</span></div>
  <div class="row"><span class="tag">H2 · 28</span><span class="h2">Por qué Norsolar es diferente</span></div>
  <div class="row"><span class="tag">H3 · 20</span><span class="h3">Experiencia comprobada</span></div>
  <div class="row"><span class="tag">BODY · 16</span><span class="body">Combinamos experiencia local y tecnología de clase mundial.</span></div>
  <div class="row"><span class="tag">SMALL · 13</span><span class="small">+250 proyectos instalados en Ecuador</span></div>
</body>
</html>
