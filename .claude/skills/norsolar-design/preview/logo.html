<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Norsolar · Logo</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0; height: 220px; }
  .cell { display: flex; align-items: center; justify-content: center; padding: 24px; }
  .cell.light { background: #fff; }
  .cell.alt { background: var(--ns-bg-alt); }
  .cell.navy { background: var(--ns-navy-deep); }
  .cell.orange { background: var(--ns-orange); }
  img { max-width: 80%; max-height: 130px; object-fit: contain; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell light"><img src="../assets/logo-color.png" alt="Logo Norsolar color" /></div>
    <div class="cell alt"><img src="../assets/logo-navy.png" alt="Logo Norsolar navy" /></div>
    <div class="cell navy"><img src="../assets/logo-dark-bg.png" alt="Logo sobre navy" /></div>
    <div class="cell orange"><img src="../assets/logo-white.png" alt="Logo blanco" /></div>
  </div>
</body>
</html>
