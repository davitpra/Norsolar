<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Norsolar · Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 32px 36px; background: #fff; font-family: var(--font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 22px; }
  .btn {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 14px;
    padding: 14px 26px;
    border-radius: 10px;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 200ms cubic-bezier(0.22,1,0.36,1);
  }
  .btn-primary { background: var(--ns-orange); color: #fff; }
  .btn-primary.hover { background: var(--ns-orange-hover); }
  .btn-secondary { background: transparent; color: var(--ns-navy); border: 1.5px solid var(--ns-navy); }
  .btn-ghost { background: transparent; color: var(--ns-navy); padding: 14px 4px; }
  .btn-ghost::after { content: "→"; transition: transform 200ms; }
  .btn-ghost.hover { color: var(--ns-orange); }
  .btn-on-dark { background: var(--ns-orange); color: #fff; }
  .dark-row {
    background: var(--ns-navy-deep);
    padding: 16px 20px;
    border-radius: 12px;
    margin-top: 6px;
  }
  .label {
    font-family: ui-monospace, monospace;
    font-size: 10px;
    color: var(--ns-text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    width: 100%;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="label">PRIMARY · HOVER · SECONDARY · GHOST</div>
    <button class="btn btn-primary">Cotiza Gratis</button>
    <button class="btn btn-primary hover">Cotiza Gratis</button>
    <button class="btn btn-secondary">Ver Proyectos</button>
    <button class="btn btn-ghost">Ver más</button>
    <button class="btn btn-ghost hover">Ver más</button>
  </div>
  <div class="dark-row row" style="margin-bottom: 0;">
    <button class="btn btn-on-dark">Enviar Cotización</button>
    <button class="btn" style="background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.2)">Saber más</button>
  </div>
</body>
</html>
